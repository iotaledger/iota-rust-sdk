[package]
name = "iota-sdk-ffi"
version = "0.0.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "uniffi_bindgen.rs"

[lib]
name = "iota_sdk_ffi"
crate-type = ["lib", "cdylib"]

[features]
default = ["crypto", "bls12381", "zklogin"]
crypto = [
  "iota-sdk/crypto",
  "iota-sdk/ed25519",
  "iota-sdk/secp256r1",
  "iota-sdk/passkey",
  "iota-sdk/secp256k1",
  "iota-sdk/pem",
  "iota-sdk/bech32",
  "iota-sdk/mnemonic",
]
bls12381 = ["iota-sdk/bls12381"]
zklogin = ["iota-sdk/zklogin"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
derive_more = { workspace = true, features = ["from", "deref", "display"] }
hex.workspace = true
paste.workspace = true
primitive-types.workspace = true
rand.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
# wasm-unstable-single-threaded relaxes Send+Sync checks on wasm32 targets only
uniffi = { version = "0.29", features = ["cli", "tokio", "wasm-unstable-single-threaded", "scaffolding-ffi-buffer-fns"] }

iota-sdk = { version = "3.0.0-alpha.1", path = "../iota-sdk", default-features = false, features = ["graphql", "txn-builder", "types", "serde", "rand", "hash"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm needs macros+rt for async and sync for tokio::sync::RwLock used in the graphql client
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
# rand 0.8.x depends on getrandom 0.2; the `js` feature enables the wasm_js backend
# for that version. getrandom 0.3 (in wasm-cargo-patch.toml for the generated bridge
# crate) uses a cfg-based backend instead — both versions can coexist in the dep tree.
getrandom = { version = "0.2", features = ["js"] }
