[package]
name = "iota-sdk-ffi"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "iota_sdk_bindings"
path = "uniffi_bindgen.rs"

[lib]
name = "iota_sdk_ffi"
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1.0"
derive_more = { version = "2.0", features = ["from", "deref"] }
rand = "0.8"
serde_json = { version = "1.0.95" }
tokio = { version = "1.36.0", features = ["time"] }
uniffi = "0.29"

iota-graphql-client = { version = "0.0.1", path = "../iota-graphql-client", features = ["uniffi"] }
iota-types = { package = "iota-sdk-types", version = "0.0.1", path = "../iota-sdk-types", features = ["uniffi", "hash", "rand"] }
