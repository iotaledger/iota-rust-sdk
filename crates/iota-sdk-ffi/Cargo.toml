[package]
name = "iota-sdk-ffi"
version = "0.0.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "FFI layer powering the IOTA SDK language bindings via UniFFI"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi_bindgen.rs"

[lib]
name = "iota_sdk_ffi"
crate-type = ["lib", "cdylib"]

[features]
default = ["crypto", "bls12381", "grpc"]
# TLS is enabled so that the HTTPS constructors (`new_mainnet`,
# `new_testnet`, ...) work out of the box. The bundled webpki roots are used
# instead of the platform's native certificate store because the latter is
# unavailable on mobile targets (Android/iOS bindings); this also matches the
# behavior of the GraphQL client (reqwest with `rustls`).
grpc = [
  "iota-sdk/grpc",
  "iota-sdk/grpc-tls-aws-lc",
  "iota-sdk/grpc-tls-webpki-roots",
]
crypto = [
  "iota-sdk/bech32",
  "iota-sdk/crypto",
  "iota-sdk/ed25519",
  "iota-sdk/mnemonic",
  "iota-sdk/passkey",
  "iota-sdk/pem",
  "iota-sdk/secp256k1",
  "iota-sdk/secp256r1",
]
bls12381 = ["iota-sdk/bls12381"]

[lints]
workspace = true

[dependencies]
# external dependencies
async-stream.workspace = true
async-trait = "0.1.92"
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
derive_more = { workspace = true, features = ["from", "deref", "display"] }
futures.workspace = true
hex.workspace = true
paste.workspace = true
primitive-types.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
# wasm-unstable-single-threaded relaxes Send+Sync checks on wasm32 targets only
uniffi = { version = "0.31", features = ["cli", "tokio", "wasm-unstable-single-threaded", "scaffolding-ffi-buffer-fns"] }

# internal dependencies
iota-sdk = { version = "3.0.0-beta.1", path = "../iota-sdk", default-features = false, features = ["graphql", "txn-builder", "types", "move-types", "serde", "rand", "hash"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm additionally needs macros+rt for async
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
