[package]
name = "iota-sdk-ffi"
version = "0.0.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "FFI layer powering the IOTA SDK language bindings via UniFFI"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi_bindgen.rs"

[lib]
name = "iota_sdk_ffi"
crate-type = ["lib", "cdylib"]

[features]
default = ["crypto", "bls12381"]
crypto = [
  "iota-sdk/bech32",
  "iota-sdk/crypto",
  "iota-sdk/ed25519",
  "iota-sdk/mnemonic",
  "iota-sdk/passkey",
  "iota-sdk/pem",
  "iota-sdk/secp256k1",
  "iota-sdk/secp256r1",
]
bls12381 = ["iota-sdk/bls12381"]

[lints]
workspace = true

[dependencies]
# external dependencies
async-stream.workspace = true
async-trait = "0.1.89"
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
derive_more = { workspace = true, features = ["from", "deref", "display"] }
futures.workspace = true
hex.workspace = true
paste.workspace = true
primitive-types.workspace = true
rand.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
# wasm-unstable-single-threaded relaxes Send+Sync checks on wasm32 targets only
uniffi = { version = "0.31", features = ["cli", "tokio", "wasm-unstable-single-threaded", "scaffolding-ffi-buffer-fns"] }

# internal dependencies
iota-sdk = { version = "3.0.0-beta.1", path = "../iota-sdk", default-features = false, features = ["graphql", "txn-builder", "types", "move-types", "serde", "rand", "hash"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# sync for tokio::sync::RwLock used in the graphql client wrapper
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm additionally needs macros+rt for async
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
