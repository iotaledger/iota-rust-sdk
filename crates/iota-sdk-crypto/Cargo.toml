[package]
name = "iota-sdk-crypto"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Defines the interface for signing and verifying messages in the IOTA ecosystem"

[lints]
workspace = true

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg=doc_cfg -Zunstable-options --generate-link-to-definition" RUSTC_BOOTSTRAP=1 cargo doc --all-features --no-deps --open
all-features = true
rustdoc-args = [
  # Enable doc_cfg showing the required features.
  "--cfg=doc_cfg",
  # Generate links to definition in rustdoc source code pages
  # https://github.com/rust-lang/rust/pull/84176
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
default = []
ed25519 = ["dep:fastcrypto", "dep:rand_core", "dep:zeroize"]
secp256r1 = ["dep:fastcrypto", "dep:rand_core", "dep:zeroize"]
passkey = ["secp256r1", "dep:sha2"]
secp256k1 = ["dep:fastcrypto", "dep:rand_core", "dep:zeroize"]
bech32 = ["dep:bech32", "signature/std"]
# PKCS#8/PEM support. fastcrypto has no PKCS#8 codec, so ed25519, p256 and
# k256 are pulled in purely as encoders/decoders here; the actual signing and
# verification always go through fastcrypto.
pem = [
  "dep:ed25519",
  "dep:k256",
  "dep:p256",
  "dep:pem-rfc7468",
  "dep:pkcs8",
  "ed25519?/pem",
  "ed25519?/pkcs8",
  "ed25519?/zeroize",
  "k256?/pem",
  "k256?/pkcs8",
  "p256?/pem",
  "p256?/pkcs8",
]
bls12381 = ["dep:blst", "dep:rand_core", "dep:roaring", "signature/std"]
mnemonic = ["dep:bip32", "dep:bip39", "dep:slip10_ed25519"]

[dependencies]
# external dependencies
# bech32 encoding support
bech32 = { version = "0.11.0", optional = true }
# mnemonic support
bip32 = { version = "0.5.3", optional = true }
bip39 = { version = "2.0.0", features = ["rand"], optional = true }
# bls12381 support
blst = { version = "0.3.13", optional = true }
# ed25519 PKCS#8/PEM codec (see the `pem` feature)
ed25519 = { version = "2.2", optional = true }
# ed25519, secp256r1 and secp256k1 signing/verification backend
fastcrypto = { version = "=0.1.11", optional = true }
# secp256k1 PKCS#8/PEM codec (see the `pem` feature)
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"], optional = true }
# secp256r1 PKCS#8/PEM codec (see the `pem` feature)
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"], optional = true }
# pkcs8 der and pem support
pem-rfc7468 = { version = "0.7", optional = true, features = ["std"] }
pkcs8 = { version = "0.10", optional = true, features = ["std"] }
# RNG support
rand_core = { workspace = true, optional = true }
roaring = { workspace = true, optional = true }
# passkey verification support
sha2 = { version = "0.10.8", optional = true }
signature = "2.2"
slip10_ed25519 = { version = "0.1.3", optional = true }
thiserror.workspace = true
zeroize = { version = "1.8", features = ["derive"], optional = true }

# internal dependencies
iota-types = { workspace = true, features = ["hash", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# On wasm32 fastcrypto needs getrandom's "js" backend, enabled by its "wasm" feature.
fastcrypto = { version = "=0.1.11", optional = true, features = ["wasm"] }

[dev-dependencies]
# external dependencies
base64ct = { workspace = true, features = ["alloc"] }
bcs.workspace = true
hex.workspace = true
proptest = { workspace = true, features = ["std"] }
rand.workspace = true
test-strategy.workspace = true

# internal dependencies
# proptest support in tests
iota-types = { workspace = true, features = ["proptest"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# getrandom 0.2's "js" feature is inherited from iota-types (a real wasm dep there).
# getrandom 0.3 needs the `getrandom_backend="wasm_js"` rustflag too (.cargo/config.toml); proptest pulls it into our tests.
getrandom_3.workspace = true
wasm-bindgen-test.workspace = true

[package.metadata.cargo-machete]
ignored = ["pem-rfc7468"]
