syntax = "proto3";

package iota.grpc.v1.object;

import "google/protobuf/struct.proto";

import "iota/grpc/options.proto";
import "iota/grpc/v1/bcs.proto";
import "iota/grpc/v1/types.proto";

// An object on the IOTA blockchain.
message Object {
  // Reference to this object.
  optional iota.grpc.v1.types.ObjectReference reference = 1;
  // This Object serialized as BCS.
  optional iota.grpc.v1.bcs.BcsData bcs = 2;
  // JSON rendering of the object's Move contents.
  optional google.protobuf.Value json = 3;
  // Rendering of the object's on-chain Display template, when its type has one.
  optional Display display = 4;
}

// Rendering of an object's on-chain Display template.
message Display {
  // Rendered Display fields; a field that failed to render is null (see `errors`).
  optional google.protobuf.Value output = 1;
  // Map of Display field name to error message for fields that failed to render.
  optional google.protobuf.Value errors = 2;
}

// A list of objects.
message Objects {
  option (iota.grpc.field_mask_transparent) = true;

  repeated Object objects = 1;
}
