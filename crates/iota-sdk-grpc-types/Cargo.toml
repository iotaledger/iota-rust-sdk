[package]
name = "iota-sdk-grpc-types"
version = "1.0.0-beta.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "gRPC/protobuf types for the IOTA Blockchain"

[lints]
workspace = true

[dependencies]
# external dependencies
bcs.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tap = "1.0"
tonic.workspace = true
tonic-prost = "0.14"

# internal dependencies
iota-types = { workspace = true, features = ["serde"] }

[dev-dependencies]
base64ct = { workspace = true, features = ["alloc"] }
