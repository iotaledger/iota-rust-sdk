[package]
name = "iota-sdk-grpc-types"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
# external dependencies
bcs.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tap = "1.0"
# Only the client/server codegen support is needed here; the transport layer
# (hyper/tokio net) does not build for wasm32 and lives in `iota-sdk-grpc-client`.
tonic = { workspace = true, default-features = false, features = ["codegen"] }
tonic-prost = "0.14"

# internal dependencies
iota-types = { workspace = true, features = ["serde"] }

[dev-dependencies]
base64ct = { workspace = true, features = ["alloc"] }
