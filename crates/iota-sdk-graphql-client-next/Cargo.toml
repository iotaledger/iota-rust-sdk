[package]
name = "iota-sdk-graphql-client-next"
version = "1.0.0-beta.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "GraphQL RPC client for the IOTA blockchain"

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg=doc_cfg -Zunstable-options --generate-link-to-definition" RUSTC_BOOTSTRAP=1 cargo doc --all-features --no-deps --open
all-features = true
rustdoc-args = [
  # Enable doc_cfg showing the required features.
  "--cfg=doc_cfg",
  # Generate links to definition in rustdoc source code pages
  # https://github.com/rust-lang/rust/pull/84176
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
# Built-in HTTP transport, TLS crypto provider and trust anchors; see README.md.
default = ["reqwest", "tls-native-roots", "tls-ring", "tls-webpki-roots"]
move-types = ["dep:iota-move-types"]
reqwest = ["dep:reqwest"]
tls-aws-lc = [
  "dep:rustls",
  "reqwest",
  "reqwest/rustls-no-provider",
  "rustls/aws-lc-rs",
]
tls-native-roots = []
tls-ring = [
  "dep:rustls",
  "reqwest",
  "reqwest/rustls-no-provider",
  "rustls/ring",
]
tls-webpki-roots = ["dep:webpki-root-certs"]

[lints]
workspace = true

[dependencies]
# external dependencies
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
cynic.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

# internal dependencies
iota-client-api.workspace = true
iota-move-types = { workspace = true, features = ["serde"], optional = true }
iota-types = { workspace = true, features = ["serde", "hash"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, optional = true }
tokio = { workspace = true, features = ["time"] }
webpki-root-certs = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
# external dependencies
eyre.workspace = true

# internal dependencies
iota-crypto = { workspace = true, features = ["ed25519"] }
iota-transaction-builder.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
iota-graphql-client-build.workspace = true

[[example]]
name = "configuration"
required-features = ["reqwest"]

[[example]]
name = "custom_transport"
required-features = ["reqwest"]

[[example]]
name = "move_objects"
required-features = ["move-types"]
