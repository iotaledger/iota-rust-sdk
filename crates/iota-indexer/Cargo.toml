[package]
name = "iota-indexer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Checkpoint/transaction/event indexer built with the IOTA Rust SDK"

[dependencies]
base64ct = { workspace = true, features = ["alloc"] }
bcs.workspace = true
clap = { version = "4.5", features = ["derive"] }
iota-sdk = { workspace = true, features = ["graphql", "types", "serde", "hash"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
