[package]
name = "iota-sdk-types"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Core types for the IOTA SDK"

[lints]
workspace = true

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg=doc_cfg -Zunstable-options --generate-link-to-definition" RUSTC_BOOTSTRAP=1 cargo doc --all-features --no-deps --open
all-features = true
rustdoc-args = [
  # Enable doc_cfg showing the required features.
  "--cfg=doc_cfg",
  # Generate links to definition in rustdoc source code pages
  # https://github.com/rust-lang/rust/pull/84176
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
default = []
bcs-schema = ["dep:iota-bcs-schema", "serde"]
serde = [
  "dep:bcs",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_repr",
  "dep:serde_with",
  "roaring/std",
]
rand = ["dep:getrandom_4", "dep:rand_core"]
hash = ["dep:blake2"]
proptest = ["dep:proptest", "dep:test-strategy", "serde"]

[dependencies]
# external dependencies
base64ct = { workspace = true, features = ["alloc", "std"] }
# Serialization and Deserialization support
bcs = { workspace = true, optional = true }
# Hash support
blake2 = { version = "0.10.6", optional = true }
bnum = "0.14.4"
bs58 = "0.5.1"
bytestring = "1.5.1"
derive_more = { workspace = true, features = ["full"] }
# OS RNG behind the `random()` constructors
getrandom_4 = { workspace = true, optional = true }
hex.workspace = true
paste.workspace = true
# proptest support
proptest = { workspace = true, features = ["std"], optional = true }
# RNG support
rand_core = { workspace = true, optional = true }
roaring.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
serde_repr = { version = "0.1", optional = true }
serde_with = { version = "3.22", default-features = false, features = ["alloc"], optional = true }
strum = { workspace = true, features = ["derive"] }
test-strategy = { workspace = true, optional = true }
thiserror.workspace = true
winnow = "1.0"

# internal dependencies
iota-bcs-schema = { workspace = true, optional = true }

[build-dependencies]
filetime = "0.2"

[dev-dependencies]
bcs.workspace = true
eyre.workspace = true
num-bigint = "0.5.1"
paste.workspace = true
rand.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.2 needs its "js" feature to support wasm; force it on for this crate and everything downstream.
getrandom_2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# getrandom 0.3 additionally needs the `getrandom_backend="wasm_js"` rustflag (set in .cargo/config.toml),
# so it can't be imposed on consumers; scope it to our own wasm tests, where proptest pulls it in.
getrandom_3.workspace = true
wasm-bindgen-test.workspace = true
