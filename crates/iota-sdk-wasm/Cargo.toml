[package]
name = "iota-sdk-wasm"
version = "0.0.0"
edition = "2018"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "*"

[dependencies.iota-sdk-ffi]
path = "../iota-sdk-ffi/../../crates/iota-sdk-ffi"

[dependencies.uniffi-runtime-javascript]
features = ["wasm32"]
version = "=0.29.3-1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
features = ["wasm_js"]
version = "0.3"

[profile.release]
opt-level = "s"
