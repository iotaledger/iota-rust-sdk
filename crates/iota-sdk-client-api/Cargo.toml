[package]
name = "iota-sdk-client-api"
version = "1.0.0-beta.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Client traits shared by the IOTA Rust SDK's network clients"

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg=doc_cfg -Zunstable-options --generate-link-to-definition" RUSTC_BOOTSTRAP=1 cargo doc --no-deps --open
rustdoc-args = [
  # Enable doc_cfg showing the required features.
  "--cfg=doc_cfg",
  # Generate links to definition in rustdoc source code pages
  # https://github.com/rust-lang/rust/pull/84176
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[lints]
workspace = true

[dependencies]
iota-types.workspace = true
