[package]
name = "iota-sdk"
version = "3.0.0-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "The official SDK for IOTA"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = [
  "bech32",
  "crypto",
  "ed25519",
  "graphql",
  "hash",
  "mnemonic",
  "passkey",
  "pem",
  "rand",
  "secp256k1",
  "secp256r1",
  "serde",
  "txn-builder",
  "types",
]
# Crypto
crypto = ["dep:iota-crypto"]
ed25519 = ["crypto", "iota-crypto/ed25519"]
secp256r1 = ["crypto", "iota-crypto/secp256r1"]
passkey = ["crypto", "iota-crypto/passkey"]
secp256k1 = ["crypto", "iota-crypto/secp256k1"]
pem = ["crypto", "iota-crypto/pem"]
bls12381 = ["crypto", "iota-crypto/bls12381"]
bech32 = ["crypto", "iota-crypto/bech32"]
mnemonic = ["crypto", "iota-crypto/mnemonic"]
move-types = ["dep:iota-move-types"]
# GraphQL
graphql = ["dep:iota-graphql-client"]
# gRPC
# TLS is enabled so that the HTTPS constructors (`new_mainnet`,
# `new_testnet`, ...) work out of the box. The bundled webpki roots are used
# instead of the platform's native certificate store because the latter is
# unavailable on mobile targets (Android/iOS bindings); this also matches the
# behavior of the GraphQL client (reqwest with `rustls-tls`).
grpc = [
  "dep:iota-grpc-client",
  "dep:iota-grpc-types",
  "iota-grpc-client/tls-ring",
  "iota-grpc-client/tls-webpki-roots",
]
# Transaction Builder
txn-builder = ["dep:iota-transaction-builder"]
# Types
types = ["dep:iota-types"]
serde = ["types", "iota-types/serde"]
rand = ["types", "iota-types/rand"]
hash = ["types", "iota-types/hash"]
proptest = ["types", "iota-types/proptest"]

[dependencies]
iota-crypto = { workspace = true, features = ["ed25519"], optional = true }
iota-graphql-client = { workspace = true, optional = true }
iota-grpc-client = { workspace = true, optional = true }
iota-grpc-types = { workspace = true, optional = true }
iota-move-types = { workspace = true, features = ["serde"], optional = true }
iota-transaction-builder = { workspace = true, optional = true }
iota-types = { workspace = true, features = ["rand"], optional = true }

[dev-dependencies]
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
cynic.workspace = true
eyre.workspace = true
futures.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[build-dependencies]
iota-graphql-client-build.workspace = true

[[example]]
name = "decode_staked_iota"
required-features = ["move-types"]

[[example]]
name = "grpc_stream_checkpoints"
required-features = ["grpc"]
