[package]
name = "iota-sdk"
version = "3.0.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
description = "The official SDK for IOTA"

[features]
default = [
  "crypto",
  "ed25519",
  "secp256r1",
  "passkey",
  "secp256k1",
  "zklogin",
  "pem",
  "bls12381",
  "graphql",
  "txn-builder",
  "types",
  "serde",
  "rand",
  "hash",
  "proptest",
  "schemars",
]

# Crypto
crypto = ["dep:iota-crypto"]
ed25519 = ["crypto", "iota-crypto/ed25519"]
secp256r1 = ["crypto", "iota-crypto/secp256r1"]
passkey = ["crypto", "iota-crypto/passkey"]
secp256k1 = ["crypto", "iota-crypto/secp256k1"]
zklogin = ["crypto", "iota-crypto/zklogin"]
pem = ["crypto", "iota-crypto/pem"]
bls12381 = ["crypto", "iota-crypto/bls12381"]

# GraphQL
graphql = ["dep:iota-graphql-client"]

# Transaction Builder
txn-builder = ["dep:iota-transaction-builder"]

# Types
types = ["dep:iota-types"]
serde = ["types", "iota-types/serde"]
rand = ["types", "iota-types/rand"]
hash = ["types", "iota-types/hash"]
proptest = ["types", "iota-types/proptest"]
schemars = ["types", "iota-types/schemars"]

[dependencies]
iota-crypto = { path = "../iota-crypto", features = ["ed25519"], optional = true }
iota-graphql-client = { path = "../iota-graphql-client", optional = true }
iota-transaction-builder = { path = "../iota-transaction-builder", optional = true }
iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["rand"], optional = true }

[dev-dependencies]
base64ct = { version = "1.6.0", features = ["alloc", "std"] }
bcs = "0.1.4"
cynic = "3.7.3"
eyre = "0.6"
hex = "0.4.3"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { version = "1.0.95" }
tokio = { version = "1.40.0", features = ["full"] }

[build-dependencies]
iota-graphql-client-build = { path = "../iota-graphql-client-build" }
