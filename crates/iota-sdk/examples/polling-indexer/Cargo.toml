[package]
name = "polling-indexer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Polling-based custom indexer example using iota_sdk::graphql_client::Client"

[dependencies]
# external dependencies
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# internal dependencies
iota-sdk = { workspace = true, features = ["graphql", "types", "serde", "hash"] }
