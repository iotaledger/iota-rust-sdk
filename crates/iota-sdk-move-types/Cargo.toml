[package]
name = "iota-sdk-move-types"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Rust representations of Move types used by the IOTA blockchain"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--cfg=doc_cfg",
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
default = []
bcs-schema = ["dep:iota-bcs-schema", "serde"]
serde = ["dep:bcs", "dep:serde", "iota-types/serde"]

[dependencies]
# external dependencies
bcs = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

# internal dependencies
iota-bcs-schema = { workspace = true, optional = true }
iota-types = { workspace = true }

[dev-dependencies]
# external dependencies
# Pinned to a rev (not a branch) so test builds stay reproducible. This rev
# is also the single source of truth for the compiled-package fetch:
# `update_compiled_packages.sh` resolves it via `cargo metadata`, so the
# parser always matches the blobs it parses. Bump it to a newer monorepo
# SHA when the nightly drift workflow reports upstream type changes.
move-binary-format = { git = "https://github.com/iotaledger/iota.git", rev = "433865dc51241ebf738ca127d9fd6b4463e1ec60" }

# internal dependencies
iota-bcs-schema = { workspace = true, features = ["move-shape"] }

# `getrandom` needs an explicit wasm backend. `move-binary-format` pulls v0.2 in
# transitively (move-core-types -> primitive-types -> rand -> rand_core), so the
# wasm test build needs the js/wasm_js feature override.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom_2.workspace = true
getrandom_3.workspace = true
wasm-bindgen-test.workspace = true

[build-dependencies]
filetime = "0.2"
