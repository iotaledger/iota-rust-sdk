[package]
name = "iota-sdk-move-types"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Rust representations of Move types used by the IOTA blockchain"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--cfg=doc_cfg",
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
default = []
bcs-schema = ["dep:iota-bcs-schema", "serde"]
serde = ["dep:bcs", "dep:serde", "iota-types/serde"]

[dependencies]
bcs = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

# internal dependencies
iota-bcs-schema = { workspace = true, optional = true }
iota-types = { workspace = true }

[dev-dependencies]
iota-bcs-schema = { workspace = true, features = ["move-shape"] }
iota-graphql-client = { workspace = true }
move-binary-format = { git = "https://github.com/iotaledger/iota.git", branch = "develop" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "capture_fixtures"
path = "examples/capture_fixtures.rs"

[build-dependencies]
filetime = "0.2"
