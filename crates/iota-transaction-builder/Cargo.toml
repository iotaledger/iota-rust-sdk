[package]
name = "iota-transaction-builder"
version = "0.0.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
description = "Transaction API for the IOTA Blockchain Rust SDK"

[dependencies]
base64ct = { workspace = true, features = ["std"] }
bcs.workspace = true
derive_more = { workspace = true, features = ["from"] }
primitive-types.workspace = true
reqwest = "0.12"
serde = "1.0"
serde_json.workspace = true
thiserror = "2.0"
variadics_please = "1.1"

iota-crypto = { package = "iota-crypto", path = "../iota-crypto", features = ["ed25519"] }
iota-graphql-client = { package = "iota-graphql-client", path = "../iota-graphql-client" }
iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["serde", "hash"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1.0", features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
eyre.workspace = true
rand.workspace = true
serde_json.workspace = true

iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["rand"] }
