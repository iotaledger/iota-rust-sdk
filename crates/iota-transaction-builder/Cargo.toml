[package]
name = "iota-transaction-builder"
version = "0.0.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
description = "Transaction API for the IOTA Blockchain Rust SDK"

[dependencies]
base64ct = { version = "1.6", features = ["std"] }
bcs = "0.1"
derive_more = { version = "2.0", features = ["from"] }
iota-crypto = { package = "iota-crypto", path = "../iota-crypto", features = ["ed25519"] }
iota-graphql-client = { package = "iota-graphql-client", path = "../iota-graphql-client" }
iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["serde", "hash"] }
primitive-types = { version = "0.13", features = ["impl-serde"] }
serde = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
variadics_please = "1.1"

[dev-dependencies]
eyre = "0.6"
iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["rand"] }
rand = "0.8"
serde_json = "1.0"
