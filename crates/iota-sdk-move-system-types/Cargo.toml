[package]
name = "iota-sdk-move-system-types"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Rust representations of Move system types used by the IOTA blockchain"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--cfg=doc_cfg",
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
default = []
bcs-schema = ["dep:iota-bcs-schema", "serde"]
serde = ["dep:bcs", "dep:serde", "iota-types/serde"]

[dependencies]
bcs = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

# internal dependencies
iota-bcs-schema = { workspace = true, optional = true }
iota-types = { workspace = true }

[dev-dependencies]
# moverox versions are pinned with `=` so the regen output and the parity-test
# compile artifacts are reproducible across local dev and CI (where Cargo.lock
# is not committed). Bumping either version is a deliberate decision: review
# the resulting `generated/` diff in the same PR.
moverox = { version = "=0.1.3", features = ["bcs"] }
moverox-build = "=0.2.3"
tempfile = "3"
# Proptest drives the `*_moverox_parity` checks: a single
# `#[test_strategy::proptest]` per type generates many random values via the
# `Arbitrary` derives gated on `cfg(test)`. Activates the `proptest` feature
# of `iota-types` so `Address`, `ObjectId`, and friends become arbitrary.
proptest = { workspace = true, features = ["std"] }
test-strategy = { workspace = true }
iota-types = { workspace = true, features = ["proptest"] }

[[example]]
name = "regenerate"
path = "examples/regenerate.rs"

[build-dependencies]
filetime = "0.2"
