[package]
name = "iota-sdk-graphql-client"
version = "0.0.1-alpha.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "GraphQL RPC Client for the IOTA Blockchain"

[lints]
workspace = true

[dependencies]
# external dependencies
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
chrono = "0.4.26"
cynic.workspace = true
derive_more = { workspace = true, features = ["from"] }
futures.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url = "2.5.3"
variadics_please.workspace = true

# internal dependencies
iota-transaction-builder.workspace = true
iota-types = { workspace = true, features = ["serde", "hash"] }

# Subscriptions are delivered over a WebSocket and are only built for non-wasm
# targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-stream.workspace = true
graphql-ws-client.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_2.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# external dependencies
eyre.workspace = true
rand.workspace = true

# internal dependencies
iota-types = { workspace = true, features = ["serde", "rand", "hash"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
iota-graphql-client-build.workspace = true
