[package]
name = "iota-sdk-grpc-client"
version = "1.0.0-beta.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "gRPC client for the IOTA Blockchain"

[lints]
workspace = true

[dependencies]
# external dependencies
async-stream.workspace = true
base64 = "0.23"
futures.workspace = true
http = "1.5"
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tonic = { workspace = true, features = ["zstd"] }

# internal dependencies
iota-grpc-types.workspace = true
iota-transaction-builder.workspace = true
iota-types = { workspace = true, features = ["serde", "hash"] }

[features]
default = ["tls-ring", "tls-native-roots"]
# rustls refuses to choose when several crypto providers are compiled in, so the
# provider has to agree with the one the GraphQL client's `reqwest` uses. Both
# are on ring; pick `tls-aws-lc` only if the rest of the graph moves too.
tls-aws-lc = ["tonic/tls-aws-lc"]
tls-ring = ["tonic/tls-ring"]
tls-native-roots = ["tonic/tls-native-roots"]
tls-webpki-roots = ["tonic/tls-webpki-roots"]

[dev-dependencies]
tokio.workspace = true
