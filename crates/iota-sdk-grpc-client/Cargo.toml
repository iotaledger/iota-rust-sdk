[package]
name = "iota-sdk-grpc-client"
version = "1.0.0-beta.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "gRPC client for the IOTA Blockchain"

[lints]
workspace = true

[dependencies]
# external dependencies
async-stream = "0.3"
base64 = "0.22"
futures.workspace = true
http = "1.4"
prost.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tonic = { workspace = true, features = ["zstd"] }

# internal dependencies
iota-grpc-types.workspace = true
iota-move-types = { workspace = true, features = ["serde"], optional = true }
iota-transaction-builder.workspace = true
iota-types = { workspace = true, features = ["serde", "hash"] }

[features]
default = ["tls-ring", "tls-native-roots"]
tls-ring = ["tonic/tls-ring"]
tls-native-roots = ["tonic/tls-native-roots"]
tls-webpki-roots = ["tonic/tls-webpki-roots"]
# Typed `list_owned_move_objects` queries, decoding each object into a
# Move-type mirror.
move-types = ["dep:iota-move-types"]

[dev-dependencies]
tokio.workspace = true
