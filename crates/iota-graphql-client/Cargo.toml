[package]
name = "iota-graphql-client"
version = "0.0.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "GraphQL RPC Client for the IOTA Blockchain"

[dependencies]
base64ct = { workspace = true, features = ["alloc", "std"] }
bcs.workspace = true
chrono = "0.4.26"
cynic = "3.7.3"
derive_more = { workspace = true, features = ["from"] }
eyre.workspace = true
futures = "0.3.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.36.0", features = ["time"] }
tracing = "0.1.37"
url = "2.5.3"

iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["serde"] }

[dev-dependencies]
hex.workspace = true
rand.workspace = true

iota-crypto = { path = "../iota-crypto", features = ["ed25519", "pem", "bech32"] }
iota-transaction-builder = { path = "../iota-transaction-builder" }
iota-types = { package = "iota-sdk-types", path = "../iota-sdk-types", features = ["serde", "rand", "hash"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
iota-graphql-client-build = { path = "../iota-graphql-client-build" }
