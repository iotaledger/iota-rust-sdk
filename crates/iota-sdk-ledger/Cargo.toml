[package]
name = "iota-sdk-ledger"
version = "1.0.0-rc.1"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/iotaledger/iota-rust-sdk/"
description = "Communicates with the IOTA app on Ledger hardware wallets"

[lints]
workspace = true

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg=doc_cfg -Zunstable-options --generate-link-to-definition" RUSTC_BOOTSTRAP=1 cargo doc --all-features --no-deps --open
all-features = true
rustdoc-args = [
  # Enable doc_cfg showing the required features.
  "--cfg=doc_cfg",
  # Generate links to definition in rustdoc source code pages
  # https://github.com/rust-lang/rust/pull/84176
  "-Zunstable-options",
  "--generate-link-to-definition",
]

[features]
default = ["hid"]
hid = ["dep:ledger-transport", "dep:ledger-transport-hid"]
speculos = []

[dependencies]
# external dependencies
bcs.workspace = true
futures.workspace = true
futures-timer = "3.0"
hex.workspace = true
# USB HID transport
ledger-transport = { version = "0.11.0", optional = true }
ledger-transport-hid = { version = "0.11.0", optional = true }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# internal dependencies
iota-crypto.workspace = true
iota-types = { workspace = true, features = ["hash", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }
