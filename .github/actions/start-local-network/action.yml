name: "Start Local IOTA Network"
description: "Downloads and starts a local IOTA network for testing via run_localnet.sh"

runs:
  using: "composite"
  steps:
    - name: Get the IOTA binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Uncomment when using a nightly build
        # nightly=$(gh run list --repo iotaledger/iota --workflow release.yml --status success --branch develop --limit 1 --json startedAt,databaseId,event -q '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")] | first')
        # database_id=$(echo $nightly | jq '.databaseId')
        # event=$(echo $nightly | jq -r '.event')
        # if [ "$event" = "workflow_dispatch" ]; then
        #   artifact_name="iota-develop-linux-x86_64"
        # else
        #   started_at=$(echo $nightly | jq -r '.startedAt' | cut -dT -f1)
        #   artifact_name="iota-nightly-$started_at-linux-x86_64"
        # fi
        # gh run download --repo iotaledger/iota $database_id -n "$artifact_name"
        # tar -zxvf "$artifact_name.tgz" ./iota ./iota-localnet

        # Uncomment when using a branch build (dispatch release.yml on that branch first)
        # IOTA_BRANCH="feat/update-graphql-rpc-checkpoint-bcs"
        # # No --status filter: the linux artifact is available as soon as its
        # # matrix job uploads it, even while other platforms are still building.
        # database_id=$(gh run list --repo iotaledger/iota --workflow release.yml --branch "$IOTA_BRANCH" --limit 1 --json databaseId -q '.[0].databaseId')
        # artifact_name="iota-$(echo $IOTA_BRANCH | tr "/" "-")-linux-x86_64"
        # gh run download --repo iotaledger/iota $database_id -n "$artifact_name"
        # tar -zxvf "$artifact_name.tgz" ./iota ./iota-localnet

        # Uncomment when using a released build
        IOTA_BINARY_VERSION="v1.31.1-rc"
        ASSET_NAME="iota-$IOTA_BINARY_VERSION-linux-x86_64.tgz"
        download_url="https://github.com/iotaledger/iota/releases/download/$IOTA_BINARY_VERSION/$ASSET_NAME"
        echo "Downloading binary from $download_url"
        wget -q $download_url -O iota.tgz
        tar -zxvf iota.tgz ./iota ./iota-localnet

        chmod +x ./iota ./iota-localnet
        # Make `iota` available on PATH for `iota move build` used by test fixtures
        echo "$(pwd)" >> $GITHUB_PATH

        # Bootstrap ~/.iota/iota_config so subsequent `iota move build` calls
        # don't fall into the interactive setup wizard (which writes prompts to
        # stdout and hangs in CI). The network isn't up yet, so the call logs a
        # connection error but still writes the config and exits 0.
        ./iota client -y new-env --alias localnet --rpc http://127.0.0.1:9000 || true

    - name: Start local network and gas station
      shell: bash
      env:
        IOTA_START_EXTRA_ARGS: "--pg-port 5432 --pg-db-name iota_indexer_v2 --epoch-duration-ms 10000"
      run: ./run_localnet.sh start ./iota-localnet
