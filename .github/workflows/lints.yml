name: Lints

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: lints-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-hack

      - name: Install latest nightly
        run: rustup toolchain install nightly-2026-06-29 --component rustfmt --allow-downgrade

      - name: rustfmt
        run: make check-fmt

      - name: clippy
        if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
        run: make clippy

      - name: rustdoc
        if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
        run: make doc

      - name: BCS schema
        if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
        run: make bcs-schema

      - run: make is-dirty

  cargo-sort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dprint
        run: curl -fsSL https://dprint.dev/install.sh | sh && echo "$HOME/.dprint/bin" >> $GITHUB_PATH

      - name: Sort, consolidate, and format Cargo.toml dependencies
        run: make cargo-sort

      - name: Check for uncommitted Cargo.toml changes
        run: |
          if ! git diff --quiet -- '*.toml'; then
            echo "Cargo.toml files not properly sorted, consolidated, or formatted! Please run 'make cargo-sort'."
            git diff -- '*.toml'
            exit 1
          fi

  sort-derives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check derive trait ordering
        run: make check-sort-derives

  cargo-deny:
    if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: cargo deny (bans, licenses, sources, advisories)
        run: cargo deny --manifest-path './Cargo.toml' check bans licenses sources advisories --hide-inclusion-graph

  check-unused-deps:
    name: Check Unused Dependencies (${{ matrix.flags }})
    if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
    strategy:
      matrix:
        flags: ["--all-features", "--no-default-features"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-udeps
        # Built from source (cached) because the prebuilt musl-static binary
        # intermittently segfaults while unpacking the large iota monorepo
        # git dependency.
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-udeps@0.1.61
      - name: Run Cargo Udeps
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo +nightly-2026-06-29 udeps ${{ matrix.flags }}

  proto-build:
    if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate gRPC types
        run: make grpc

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet -- crates/iota-sdk-grpc-types/src/proto/generated/; then
            echo "Generated gRPC types are out of date! Please run 'make grpc' and commit the changes."
            git diff -- crates/iota-sdk-grpc-types/src/proto/generated/
            exit 1
          fi
