name: Pre-publish

on:
  workflow_dispatch:
    inputs:
      level:
        type: choice
        required: true
        description: |
          The level of version bump to make.

          Possible values:
          - major:   Increase the major version (x.0.0)
          - minor:   Increase the minor version (x.y.0)
          - patch:   Increase the patch version (x.y.z)
          - release: Remove the pre-version (x.y.z)
          - rc:      Increase the rc pre-version (x.y.z-rc.M)
          - beta:    Increase the beta pre-version (x.y.z-beta.M)
          - alpha:   Increase the alpha pre-version (x.y.z-alpha.M)
        options:
          - major
          - minor
          - patch
          - release
          - rc
          - beta
          - alpha
      package:
        type: choice
        required: true
        description: The package to publish.
        options:
          - iota-sdk-types
          - iota-sdk-crypto
          - iota-sdk-graphql-client-build
          - iota-sdk-graphql-client
          - iota-sdk-transaction-builder
          - iota-sdk
          - iota-go-sdk
          - iota-kotlin-sdk
          - iota-python-sdk

jobs:
  publish:
    name: Setup for publishing ${{ inputs.package }}
    permissions:
      id-token: write # Enable OIDC
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Exit if the branch is not develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "Branch is not develop, exiting."
          exit 0

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # required for git-cliff to have full history

      - name: Install cargo-release
        if: startsWith(inputs.package, 'iota-sdk')
        uses: taiki-e/install-action@f535147c22906d77695e11cb199e764aa610a4fc # v2.62.46
        with:
          tool: cargo-release@0.25.20

      - name: Install git-cliff
        uses: taiki-e/install-action@f535147c22906d77695e11cb199e764aa610a4fc # v2.62.46
        with:
          tool: git-cliff

      # TODO does this actually work?
      - uses: chainguard-dev/actions/setup-gitsign@0cda751b114eb55c388e88f7479292668165602a # v1.0.2

      - name: Bump Kotlin version
        if: inputs.package == 'iota-kotlin-sdk'
        id: bump-kotlin
        run: |
          # Read current version from build.gradle.kts
          CURRENT_VERSION=$(grep '^version = ' bindings/kotlin/build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          # Bump the version using the input level
          source ./.github/bump_version.sh
          NEW_VERSION=$(bump_semver "$CURRENT_VERSION" "${{ inputs.level }}")
          export NEW_VERSION
          echo "New version: $NEW_VERSION"

          # Update the version in build.gradle.kts
          sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" bindings/kotlin/build.gradle.kts
          echo "Updated build.gradle.kts with new version: $NEW_VERSION"

          # Generate changelog for Kotlin
          export CRATE_ROOT="bindings/kotlin"
          ./.github/gen-changelog.sh

          # Set output for the next step
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # - name: Create PR for Python
      #   if: inputs.package == 'python-sdk'
      #   run: |
      #     echo "Creating PR for Python SDK - Not yet implemented."
      # TODO @alex  get version, bump it, update it
      # TODO @alex generate changelog

      - name: Create PR for Rust
        if: startsWith(inputs.package, 'iota-sdk')
        id: pr-create
        uses: cargo-bins/release-pr@0c019c0e5a6b9f722578d231d43ba900cacc5ffa # v2.1.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.level }}
          crate-name: ${{ inputs.package }}
          git-user-name: "IOTA Foundation"
          git-user-email: info@iota.org
          base-branch: develop
          pr-template-file: ./.github/release-pr-template.ejs

      - name: Create Pull Request
        if: inputs.package == 'iota-kotlin-sdk' || inputs.package == 'iota-python-sdk'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Bump ${{ inputs.package }} version to ${{ steps.bump-kotlin.outputs.new_version }}"
          title: "Bump ${{ inputs.package }} version to ${{ steps.bump-kotlin.outputs.new_version }}"
          body: "Automated semver bump of ${{ inputs.package }} version."
          branch: "release/${{ inputs.package }}/${{ steps.bump-kotlin.outputs.new_version }}"
          delete-branch: true

      - name: Set release notes env vars (Rust)
        if: startsWith(inputs.package, 'iota-sdk')
        run: |
          echo "PR_NUM=$(echo "${{ steps.pr-create.outputs.pr-url }}" | sed -nr 's|.*/pull/(.*)|\1|p')" >> $GITHUB_ENV
          echo "CHANGELOG_DIR=crates/${{ inputs.package }}" >> $GITHUB_ENV
          echo "VERSION_TAG=v${{ steps.pr-create.outputs.version }}" >> $GITHUB_ENV

      - name: Set release notes env vars (Kotlin)
        if: inputs.package == 'iota-kotlin-sdk'
        run: |
          echo "PR_NUM=${{ steps.create-pr.outputs.pull-request-number }}" >> $GITHUB_ENV
          echo "CHANGELOG_DIR=bindings/kotlin" >> $GITHUB_ENV
          echo "VERSION_TAG=v${{ steps.bump-kotlin.outputs.new_version }}" >> $GITHUB_ENV

      - name: Set release notes env vars (Python)
        if: inputs.package == 'iota-python-sdk'
        run: |
          echo "PR_NUM=${{ steps.create-pr.outputs.pull-request-number }}" >> $GITHUB_ENV
          echo "CHANGELOG_DIR=bindings/python" >> $GITHUB_ENV
          echo "VERSION_TAG=v${{ steps.bump-kotlin.outputs.new_version }}" >> $GITHUB_ENV

      - name: Add release notes
        if: steps.pr-create.outputs.pr-url || steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh pr view "$PR_NUM" --json body | jq -r '.["body"]')
          cd "$CHANGELOG_DIR"
          notes=$(git-cliff --unreleased --tag "$VERSION_TAG" --include-path ".")
          body=$(echo "$body
          # Release Notes

          $notes")
          gh pr edit "$PR_NUM" --body "$body"

  bump-go-version:
    if: inputs.package == 'iota-go-sdk'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump-go-version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Bump go version
        id: bump-go-version
        run: |
          git fetch --tags
          latest_tag=$(git tag -l "*iota-go-sdk*" --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="iota-go-sdk-v0.0.0"
          fi
          latest_version=$(echo "$latest_tag" | sed -nr 's|.*-v(.*)|\1|p')
          source .github/bump_version.sh
          new_version=$(bump_semver "$latest_version" "${{ inputs.level || 'patch' }}")
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

  go-release:
    needs: bump-go-version
    uses: ./.github/workflows/release.yml
    with:
      package: iota-go-sdk
      version: ${{ needs.bump-go-version.outputs.new_version }}
