name: Publish to PyPi

on:
  # TODO: remove after testing
  push:
    branches: [ci/python-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for release version)"
        required: false
        type: string
      dry_run:
        description: "Dry run - publish to Test-PyPi repo only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build platform specific wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_ext: so
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   lib_ext: so
          - os: macos-latest
            target: x86_64-apple-darwin
            lib_ext: dylib
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_ext: dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install `uniffi-bindgen` for maturin
        shell: bash
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install wheel
        shell: bash
        run: python -m pip install --upgrade pip wheel

      - name: Set version for manual dispatch
        shell: bash
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          sed -i "s/version = .*/version = \"${{ github.event.inputs.version }}\"/" bindings/python/src/pyproject.toml

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release
          working-directory: bindings/python/src
          manylinux: auto

      - name: Repair wheel
        shell: bash
        run: |
          WHEEL_PATH="$(find target/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          [[ -f $WHEEL_PATH ]] || exit 1
          .github/scripts/repair_whl.sh "$WHEEL_PATH" "${{ matrix.lib_ext }}"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  sdist:
    name: Build a source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install `uniffi-bindgen` for maturin
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Set version for manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          sed -i "s/version = .*/version = \"${{ github.event.inputs.version }}\"/" bindings/python/src/pyproject.toml

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build, sdist]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download the artifacts from the build job
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true

      - name: Ensure wheels and sdist exist before publishing
        run: |
          shopt -s nullglob
          files=( *.whl *.tar.gz )
          (( ${#files[@]} )) || { echo "No data found to upload"; exit 1; }
          echo "Publishing:"
          printf '  - %s\n' "${files[@]}"

      - name: Publish to PyPI
        if: ${{ !fromJSON(inputs.dry_run) }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing *.whl *.tar.gz

      - name: Publish to TestPyPI only (Dry Run)
        if: ${{ fromJSON(inputs.dry_run) }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        with:
          command: upload
          args: --repository testpypi --non-interactive --skip-existing *.whl *.tar.gz
