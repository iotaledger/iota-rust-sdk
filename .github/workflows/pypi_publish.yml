name: Publish to PyPi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for release version)"
        required: false
        type: string
      test_publish:
        description: "Publish to Test-PyPi only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: i686
          - target: aarch64
          - target: armv7l
          - target: ppc64le
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331
        with:
          toolchain: stable #1.91.1

      - name: Install `uniffi-bindgen` for maturin
        run: cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          manylinux: 2_28
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wheel-linux-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: x86
          - target: aarch64
          - target: armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331
        with:
          toolchain: stable #1.91.1

      - name: Install `uniffi-bindgen` for maturin
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          manylinux: musllinux_1_2
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wheel-musllinux-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331
        with:
          toolchain: stable #1.91.1

      - name: Install `uniffi-bindgen` for maturin
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i '' -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wheel-macos-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        platform:
          - target: x64
          - target: x86
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331
        with:
          toolchain: stable #1.91.1

      - name: Install `uniffi-bindgen` for maturin
        shell: bash
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          architecture: ${{ matrix.platform.target }}

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        shell: bash
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wheel-windows-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  sdist:
    name: Build a source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [linux, musllinux, macos, windows, sdist]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Ensure wheels and sdist exist
        run: |
          shopt -s nullglob
          files=( dist/*.whl dist/*.tar.gz )
          (( ${#files[@]} )) || { echo "No data found to upload"; exit 1; }
          echo "Publishing:"
          printf '  - %s\n' "${files[@]}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist

      - name: Publish to PyPI
        if: ${{ !fromJSON(inputs.test_publish) }}
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true

      - name: Publish to TestPyPI
        if: ${{ fromJSON(inputs.test_publish) }}
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true
