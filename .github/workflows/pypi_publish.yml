name: Publish to PyPi

on:
  # TODO: remove after testing
  push:
    branches: [ci/python-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for release version)"
        required: false
        type: string
      dry_run:
        description: "Dry run - publish to Test-PyPi repo only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build platform specific wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_ext: so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_ext: so
          - os: macos-latest
            target: x86_64-apple-darwin
            lib_ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_ext: dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install version-matched `uniffi-bindgen` that maturin can use
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist --find-interpreter -- --working-directory bindings/python/src
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - name: Fix wheel
        run: |
          WHEEL_PATH="$(find ./target/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          ../scripts/repair_whl.sh $WHEEL_PATH

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    name: Build a source distribution (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --release --out dist --find-interpreter -- --working-directory bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: build
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - name: Download the artifacts from the build job
        uses: actions/download-artifact@v4

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "wheels-*/*"

      - name: Publish to TestPyPI (Dry Run)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --repository testpypi --non-interactive --skip-existing wheels-*/*

      # - name: Publish to PyPI
      #   if: ${{ startsWith(github.ref, 'refs/tags/') }}
      #   uses: PyO3/maturin-action@v1
      #   env:
      #     MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      #   with:
      #     command: upload
