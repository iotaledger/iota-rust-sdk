name: Publish to PyPi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for release version)"
        required: false
        type: string
      dry_run:
        description: "Dry run - publish to Test-PyPi repo only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: i686
          - target: aarch64
          - target: armv7l
          - target: ppc64le
    # - target: s390x # fails here: crates/iota-sdk-types/src/u256.rs:51:5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install `uniffi-bindgen` for maturin
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          manylinux: 2_28
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  musllinux:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: x86
          - target: aarch64
          - target: armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install `uniffi-bindgen` for maturin
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          manylinux: musllinux_1_2
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-musllinux-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  macos:
    if: false
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install `uniffi-bindgen` for maturin
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i '' -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  windows:
    if: false
    runs-on: windows-latest
    strategy:
      matrix:
        platform:
          - target: x64
          - target: x86
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install `uniffi-bindgen` for maturin
        shell: bash
        run: |
          cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          architecture: ${{ matrix.platform.target }}

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        shell: bash
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          command: build
          args: --release --find-interpreter
          working-directory: bindings/python/src
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  sdist:
    name: Build a source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update version in pyproject.toml
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        run: |
          FILE="bindings/python/src/pyproject.toml"
          grep -q '^version = ".*"' "$FILE" || { echo "version line missing"; exit 1; }
          NEW_VERSION=${{ github.event.inputs.version }}
          echo "New version: $NEW_VERSION"
          sed -i -E "s|^version = \".*\"|version = \"${NEW_VERSION}\"|" "$FILE"
          echo "Updated pyproject.toml:"
          cat "$FILE"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [linux, musllinux, macos, windows, sdist]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true

      - name: Ensure wheels and sdist exist
        run: |
          shopt -s nullglob
          files=( *.whl *.tar.gz )
          (( ${#files[@]} )) || { echo "No data found to upload"; exit 1; }
          echo "Publishing:"
          printf '  - %s\n' "${files[@]}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Install Twine
        run: |
          pip install --upgrade twine

      - name: Publish to PyPI
        if: ${{ !fromJSON(inputs.dry_run) }}
        run: |
          twine upload \
            --non-interactive \
            --skip-existing \
            --disable-progress-bar \
            --attestations \
            *.whl *.tar.gz

      - name: Publish to TestPyPI only (Dry Run)
        if: ${{ fromJSON(inputs.dry_run) }}
        env:
          TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
        run: |
          twine upload \
            --non-interactive \
            --skip-existing \
            --disable-progress-bar \
            --attestations \
            *.whl *.tar.gz
