name: Publish to PyPi

on:
  push:
    branches: [ci/python-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for release version)"
        required: false
        type: string
      test_publish:
        description: "Publish to Test-PyPi only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: i686
          - target: aarch64
          - target: armv7l
          - target: ppc64le
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup prerequisites
        uses: ./.github/actions/python-publish-setup

      - name: Build wheel
        uses: ./.github/actions/python-publish-build
        with:
          platform: "linux"
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: x86
          - target: aarch64
          - target: armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup prerequisites
        uses: ./.github/actions/python-publish-setup

      - name: Build wheel
        uses: ./.github/actions/python-publish-build
        with:
          platform: "musllinux"
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
          - target: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup prerequisites
        uses: ./.github/actions/python-publish-setup
        with:
          sed-cmd: "sed -i ''"

      - name: Build wheel
        uses: ./.github/actions/python-publish-build
        with:
          platform: "macos"
          target: ${{ matrix.platform.target }}

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        platform:
          - target: x64
          - target: x86
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup prerequisites
        uses: ./.github/actions/python-publish-setup

      - name: Build wheel
        uses: ./.github/actions/python-publish-build
        with:
          platform: "windows"
          target: ${{ matrix.platform.target }}

  sdist:
    name: Build a source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: sdist
          working-directory: bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [linux, musllinux, macos, windows, sdist]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Ensure wheels and sdist exist
        run: |
          shopt -s nullglob
          files=( dist/*.whl dist/*.tar.gz )
          (( ${#files[@]} )) || { echo "No data found to upload"; exit 1; }
          echo "Publishing:"
          printf '  - %s\n' "${files[@]}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_publish == false)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_publish == true
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true
