name: Publish Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_publish:
        description: "Publish to Test-PyPI only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  wheels:
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-python-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - name: linux
            target: x86_64
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: i686
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: aarch64
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: armv7l
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: ppc64le
            runner: ubuntu-latest
            container: 2_28
          - name: musllinux
            target: x86_64
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: musllinux
            target: x86
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: musllinux
            target: aarch64
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: musllinux
            target: armv7
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: macos
            target: x86_64
            runner: macos-latest
            container: ""
          - name: macos
            target: aarch64
            runner: macos-latest
            container: ""
          - name: windows
            target: x64
            runner: windows-latest
            container: ""
          - name: windows
            target: x86
            runner: windows-latest
            container: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: python-${{ matrix.platform.name }}-${{ matrix.platform.target }}

      - name: Install `uniffi-bindgen` for maturin
        run: cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.9

      - name: Build ${{ matrix.platform.name }}-${{ matrix.platform.target }} wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --find-interpreter
          working-directory: bindings/python/src
          manylinux: ${{ matrix.platform.container }}
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  sdist:
    name: Build a source distribution (.tar.gz)
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-python-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          working-directory: bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Ensure wheels and sdist exist
        run: |
          shopt -s nullglob
          files=( dist/*.whl dist/*.tar.gz )
          (( ${#files[@]} )) || { echo "No data found to upload"; exit 1; }
          echo "Publishing:"
          printf '  - %s\n' "${files[@]}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_publish == true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_publish == false)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true
