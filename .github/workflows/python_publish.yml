name: Publish Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_publish:
        description: "Publish to Test-PyPI only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  wheels:
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-python-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - name: linux
            target: x86_64
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: i686
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: aarch64
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: armv7l
            runner: ubuntu-latest
            container: 2_28
          - name: linux
            target: ppc64le
            runner: ubuntu-latest
            container: 2_28
          - name: musllinux
            target: x86_64
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: musllinux
            target: x86
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: musllinux
            target: aarch64
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: musllinux
            target: armv7
            runner: ubuntu-latest
            container: musllinux_1_2
          - name: macos
            target: x86_64
            runner: macos-latest
            container: ""
          - name: macos
            target: aarch64
            runner: macos-latest
            container: ""
          - name: windows
            target: x64
            runner: windows-latest
            container: ""
          - name: windows
            target: x86
            runner: windows-latest
            container: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: python-${{ matrix.platform.name }}-${{ matrix.platform.target }}

      - name: Install `uniffi-bindgen` for maturin
        run: cargo install --path crates/iota-sdk-ffi --bin uniffi-bindgen

      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.9

      - name: Build ${{ matrix.platform.name }}-${{ matrix.platform.target }} wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.platform.target }}
          args: --release --find-interpreter
          working-directory: bindings/python/src
          manylinux: ${{ matrix.platform.container }}
          maturin-version: v1.10.1

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.platform.target }}
          path: target/wheels/*.whl

  sdist:
    name: Build a source distribution (.tar.gz)
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-python-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build sdist
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: sdist
          working-directory: bindings/python/src

      - name: Upload sdist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Ensure wheels and sdist exist
        run: |
          shopt -s nullglob
          files=( dist/*.whl dist/*.tar.gz )
          (( ${#files[@]} )) || { echo "No data found to upload"; exit 1; }
          echo "Publishing:"
          printf '  - %s\n' "${files[@]}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_publish == true
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_publish == false)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
          attestations: true
          verify-metadata: true
