name: Reference Docs

# Generates the per-language API reference markdown consumed by the docs
# site in the iota repository (see scripts/reference-docs/generate.sh) and
# publishes the tarballs as assets of the `docs-references` release, from
# where the docs build downloads them.
#
# Pull requests touching the generation pipeline only validate that
# generation succeeds; publishing happens on pushes to develop and on
# manual dispatch.

on:
  workflow_dispatch:
  push:
    branches: [develop, "claude/iota-rust-sdk-docs-zksew0"]
    paths:
      - ".github/workflows/reference_docs.yml"
      - "scripts/reference-docs/**"
      - "bindings/**"
      - "crates/iota-sdk-ffi/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/reference_docs.yml"
      - "scripts/reference-docs/**"

concurrency:
  group: reference-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  generate:
    if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, kotlin, csharp, swift]
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: reference-docs-${{ matrix.language }}

      - name: Install pydoc-markdown
        if: matrix.language == 'python'
        run: pip install pydoc-markdown

      - name: Install gomarkdoc and uniffi-bindgen-go
        if: matrix.language == 'go'
        run: |
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          make install-uniffi-bindgen-go

      - name: Setup Java
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: "oracle"
          java-version: "21"
          cache: "gradle"

      - name: Install Swift
        if: matrix.language == 'swift'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install uniffi-bindgen-cs and xmldoc2md
        if: matrix.language == 'csharp'
        run: |
          make install-uniffi-bindgen-cs
          dotnet tool install --global XMLDoc2Markdown

      - name: Generate the ${{ matrix.language }} reference
        run: ./scripts/reference-docs/generate.sh ${{ matrix.language }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-docs-${{ matrix.language }}
          path: dist/reference-docs/${{ matrix.language }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reference-docs-*
          merge-multiple: true
          path: dist/reference-docs

      - name: Update the docs-references release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view docs-references >/dev/null 2>&1; then
            gh release create docs-references --prerelease \
              --title "API reference markdown" \
              --notes "Machine-generated API reference tarballs consumed by the docs build in iotaledger/iota. Updated by the Reference Docs workflow; not for direct use."
          fi
          gh release upload docs-references dist/reference-docs/*.tar.gz --clobber
