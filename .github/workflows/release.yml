name: Create release

on:
  pull_request:
    types: closed
    branches: [develop]

# We need this to be able to create releases.
permissions:
  contents: write

jobs:
  create-release:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set package and tag from ref
        run: |
          tag=$(echo "${{ github.head_ref }}" | sed -nr 's|release/(.*)/(.*)|\1-v\2|p')
          pkg=$(echo "${{ github.head_ref }}" | sed -nr 's|release/(.*)/.*|\1|p')
          version=$(echo "${{ github.head_ref }}" | sed -nr 's|release/.*/(.*)|\1|p')
          echo "TAG=$tag" >> $GITHUB_ENV
          echo "PKG=$pkg" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Set changelog directory
        env:
          PKG: ${{ env.PKG }}
        run: |
          if [[ "$PKG" == iota-sdk* ]]; then
            echo "CHANGELOG_DIR=crates/$PKG" >> $GITHUB_ENV
          elif [[ "$PKG" == "iota-go-sdk" ]]; then
            echo "CHANGELOG_DIR=bindings/go" >> $GITHUB_ENV
          elif [[ "$PKG" == "iota-kotlin-sdk" ]]; then
            echo "CHANGELOG_DIR=bindings/kotlin" >> $GITHUB_ENV
          elif [[ "$PKG" == "iota-python-sdk" ]]; then
            echo "CHANGELOG_DIR=bindings/python" >> $GITHUB_ENV
          fi

      # TODO why is it taking the whole changelog file?

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
          PKG: ${{ env.PKG }}
          VERSION: ${{ env.VERSION }}
          CHANGELOG_DIR: ${{ env.CHANGELOG_DIR }}
        run: |
          if [[ "$VERSION" =~ .*-alpha\..*  ]] || [[ "$VERSION" =~ .*-beta\..*  ]] || [[ "$VERSION" =~ .*-rc\..*  ]]; then
            gh release create "$TAG" --title "$TAG" --target ${{ github.sha }} --draft --prerelease --notes-file "$CHANGELOG_DIR/CHANGELOG.md"
          else
            gh release create "$TAG" --title "$TAG" --target ${{ github.sha }} --draft --notes-file "$CHANGELOG_DIR/CHANGELOG.md"
          fi
