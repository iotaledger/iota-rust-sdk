name: Release

on:
  pull_request:
    types: closed
    branches:
      - "release/*/*.*.*-alpha.*"
      - "release/*/*.*.*-beta.*"
      - "release/*/*.*.*-rc.*"
      - "release/*/*.*.*"

# We need this to be able to create releases.
permissions:
  contents: write

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg=$(echo "${{ github.base_ref }}" | sed -nr 's|release/(.*)/.*|\1|p')
          echo "Releasing package $pkg"
          tag=$(echo "${{ github.base_ref }}" | sed -nr 's|release/(.*)/(.*)|\1-v\2|p')
          echo "Tag is: $tag"

          gh release create $tag --verify-tag --title $tag --draft --notes-file crates/$pkg/CHANGELOG.md
