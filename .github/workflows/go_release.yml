name: Go Release
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: "Version for the go package"
        required: true
        type: string

jobs:
  prepare-source-archive:
    name: Prepare source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Archive Go bindings
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: go-bindings
          path: bindings/go/iota_sdk


  build-darwin:
    runs-on: macOS-latest
    name: Build darwin ${{ matrix.target }}
    strategy:
      matrix:
        target: [
          aarch64-apple-darwin,
          x86_64-apple-darwin,
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install rust target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build bindings
        run: cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}
      
      - name: Archive bindings
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bindings-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libiota_sdk_ffi.dylib

  build-linux:
    runs-on: ubuntu-latest
    name: Build linux ${{ matrix.target }}
    strategy:
      matrix:
        target: [
          aarch64-unknown-linux-gnu,
          x86_64-unknown-linux-gnu,
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Install rust target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install gcc-aarch64-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install gcc-x86-64-linux-gnu
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-x86-64-linux-gnu g++-x86-64-linux-gnu

      - name: Build bindings
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/x86_64-linux-gnu-gcc
        run: cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}

      - name: Archive bindings
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bindings-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libiota_sdk_ffi.so

  release-archives:
    name: Release archives
    runs-on: ubuntu-latest
    needs:
      - prepare-source-archive
      - build-linux
      - build-darwin
    steps:
      - name: Checkout iota-sdk-go
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          repository: iotaledger/iota-sdk-go
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY_FOR_GO_SDK }}
          fetch-depth: 0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: go-bindings

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: lib/linux-aarch64

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: lib/linux-amd64

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: bindings-aarch64-apple-darwin
          path: lib/darwin-aarch64

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: bindings-x86_64-apple-darwin
          path: lib/darwin-amd64

      - name: Tag the Go package
        run: |
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions
          git add .
          git commit -m "Update Go bindings to version v0.0.3"
          git push
          git tag v0.0.3 -m "v0.0.3"
          git push --tags

# git commit -m "Update Go bindings to version v${{ inputs.version }}"
# git tag v${{ inputs.version }} -m "v${{ inputs.version }}"
