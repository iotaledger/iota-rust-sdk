name: Publish C# SDK to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_publish:
        description: "Publish to test NuGet only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare-source-archive:
    name: Prepare source archive
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-csharp-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iota-rust-sdk
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: csharp-source

      - name: Install uniffi-bindgen-cs
        run: make install-uniffi-bindgen-cs

      - name: Generate C# bindings
        run: make csharp

      - name: Archive C# SDK source
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: source
          path: |
            bindings/csharp/src
            bindings/csharp/README.md

  prepare-libraries-archives:
    name: Prepare libraries archives
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-csharp-sdk')) || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libiota_sdk_ffi.dylib
            folder: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libiota_sdk_ffi.dylib
            folder: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libiota_sdk_ffi.so
            folder: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib: libiota_sdk_ffi.so
            folder: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: iota_sdk_ffi.dll
            folder: win-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            lib: iota_sdk_ffi.dll
            folder: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout iota-rust-sdk
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install rust target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Install gcc-aarch64-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: csharp-${{ matrix.target }}

      - name: Build ${{ matrix.os }} ${{ matrix.target }} library
        if: matrix.os == 'macos-latest'
        run: RUSTFLAGS="-C link-args=-Wl,-install_name,@rpath/${{ matrix.lib }}" cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}

      - name: Build ${{ matrix.os }} ${{ matrix.target }} library
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/x86_64-linux-gnu-gcc
        run: RUSTFLAGS="-C link-args=-Wl,-rpath,$ORIGIN" cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}

      - name: Build ${{ matrix.os }} ${{ matrix.target }} library
        if: matrix.os == 'windows-latest'
        run: cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}

      - name: Prepare library archive
        run: |
          mkdir -p tmp/runtimes/${{ matrix.folder }}/native
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} tmp/runtimes/${{ matrix.folder }}/native/${{ matrix.lib }}

      - name: Archive ${{ matrix.target }} library
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.target }}
          path: tmp

  build-and-publish:
    name: Build and publish C# SDK
    runs-on: ubuntu-latest
    needs:
      - prepare-source-archive
      - prepare-libraries-archives
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Download source and libraries archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          merge-multiple: true

      - name: Pack NuGet package
        run: dotnet pack src/IotaSdk/IotaSdk.csproj --configuration Release --output ./packages

      - name: Publish to Test NuGet
        if: github.event_name == 'workflow_dispatch' && inputs.test_publish == true
        run: dotnet nuget push ./packages/*.nupkg --source https://apiint.nugettest.org/v3/index.json --api-key ${{ secrets.TEST_NUGET_API_KEY }} --skip-duplicate

      - name: Publish to NuGet
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_publish == false)
        run: dotnet nuget push ./packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
