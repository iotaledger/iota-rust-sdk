name: Publish Swift SDK to iotaledger/iota-sdk-swift

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of iota-swift-sdk to publish"
        required: true
        type: string

jobs:
  prepare-source-archive:
    name: Prepare source archive
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-swift-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iota-rust-sdk
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: swift-source

      - name: Generate Swift bindings
        run: make swift

      - name: Archive Swift SDK source
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: source
          path: |
            bindings/swift/Sources
            bindings/swift/Package.swift
            bindings/swift/README.md

  prepare-libraries-archives:
    name: Prepare libraries archives
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-swift-sdk')) || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libiota_sdk_ffi.dylib
            folder: darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libiota_sdk_ffi.dylib
            folder: darwin-aarch64
          - os: macos-latest
            target: aarch64-apple-ios
            lib: libiota_sdk_ffi.dylib
            folder: ios-aarch64
          - os: macos-latest
            target: aarch64-apple-ios-sim
            lib: libiota_sdk_ffi.dylib
            folder: ios-sim-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout iota-rust-sdk
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install rust target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: swift-${{ matrix.target }}

      - name: Build ${{ matrix.os }} ${{ matrix.target }} library
        run: ${{ contains(matrix.target, 'ios') && 'IPHONEOS_DEPLOYMENT_TARGET=18.5' || '' }} RUSTFLAGS="-C link-args=-Wl,-install_name,@rpath/${{ matrix.lib }}" cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}

      - name: Prepare library archive
        run: |
          mkdir -p tmp/lib/${{ matrix.folder }}
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} tmp/lib/${{ matrix.folder }}/${{ matrix.lib }}

      - name: Archive ${{ matrix.target }} library
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.target }}
          path: tmp

  release-archives:
    name: Release archives
    runs-on: ubuntu-latest
    needs:
      - prepare-source-archive
      - prepare-libraries-archives
    steps:
      - name: Checkout iota-sdk-swift
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          repository: iotaledger/iota-sdk-swift
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY_FOR_SWIFT_SDK }}
          fetch-depth: 0

      - name: Download source and libraries archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          merge-multiple: true

      - name: Set version to input or release tag
        id: set-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            version=$(echo "${{ github.event.release.tag_name }}" | sed -nr 's|iota-swift-sdk-v(.*)|\1|p')
            echo "version=$version" >> $GITHUB_OUTPUT
          fi

      - name: Tag the Swift SDK
        run: |
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions
          git add .
          git commit -m "Update Swift SDK to version ${{ steps.set-version.outputs.version }}"
          git push
          git tag ${{ steps.set-version.outputs.version }} -m "${{ steps.set-version.outputs.version }}"
          git push --tags
