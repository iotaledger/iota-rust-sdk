name: Upload Docs

on:
  release:
    types: [published]

jobs:
  build-and-upload-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git Status
        run: git status

      - name: Get release language
        id: get_release_language
        run: |
          if [[ ${{ github.ref }} == *"python"* ]]; then
            echo LANGUAGE="python" >> $GITHUB_OUTPUT
          fi
          if [[ ${{ github.ref }} == *"go"* ]]; then
            echo LANGUAGE="go" >> $GITHUB_OUTPUT
          fi
          if [[ ${{ github.ref }} == *"kotlin"* ]]; then
            echo LANGUAGE="kotlin" >> $GITHUB_OUTPUT
          fi

      #- name: Set up Rust
      #  uses: ./.github/actions/setup-rust
      
      # Debug print github.ref
      - name: Debug github.ref
        run: echo "github.ref ${{ github.ref }}"

      - name: Get release version
        id: get_release_version
        run: |
          VERSION=$(echo ${{ github.ref }} | sed -e 's/.*v\([0-9]*\.[0-9]*\).*/\1/')
          echo VERSION=$VERSION >> $GITHUB_OUTPUT

      - name: Build python docs
        if: steps.get_release_language.outputs.LANGUAGE == 'python'
        run: |
          cd bindings/python
          pip install pydoc-markdown
          PYTHONPATH=. pydoc-markdown
          cd -
      
      - name: Build kotlin docs
        if: steps.get_release_language.outputs.LANGUAGE == 'kotlin'
        run: |
          cd bindings/kotlin
          # Disable config cache due to Dokka/Gradle 9.2 incompatibility
          ./gradlew dokkaGfm --no-configuration-cache
          cd -

      - name: Build go docs
        if: steps.get_release_language.outputs.LANGUAGE == 'go'
        run: |
          cd bindings/go
          # Target the specific subfolder containing the .go source
          #go doc -all ./iota_sdk > ../../docs/go/go_api.md
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomarkdoc ./iota_sdk  --output ../../docs/go/go_api.md
          cd -

      - name: Compress generated docs
        run: |
          tar czvf ${{ steps.get_release_language.outputs.LANGUAGE }}.tar.gz docs/*

      - name: Upload docs to AWS S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_IOTA_WIKI }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_IOTA_WIKI }}
          AWS_DEFAULT_REGION: "eu-central-1"
        run: |
          aws s3 cp ${{ steps.get_release_language.outputs.LANGUAGE }}.tar.gz s3://files.iota.org/iota-wiki/iota-sdk/${{ steps.get_release_version.outputs.VERSION }}/ --acl public-read
