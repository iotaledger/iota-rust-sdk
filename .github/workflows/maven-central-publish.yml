name: Publish to Maven Central

on:
  # TODO: remove after testing
  push:
    branches: [ci/kotlin-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for release version)"
        required: false
        type: string
      dry_run:
        description: "Dry run - publish to local Maven repo only"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_ext: so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_ext: so
          - os: macos-latest
            target: x86_64-apple-darwin
            lib_ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_ext: dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build the bindings
        run: make kotlin TARGET=${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/kotlin/lib/**/*iota_sdk_ffi*

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          path: libs

      - name: Prepare libraries
        run: |
          echo "Listing contents of libs directory:"
          ls -la libs/
          echo "Listing contents of native-lib-ubuntu-latest-x86_64-unknown-linux-gnu:"
          ls -la libs/native-lib-ubuntu-latest-x86_64-unknown-linux-gnu/
          echo "Listing contents of bindings/kotlin/lib before copying:"
          ls -la bindings/kotlin/lib/
          cd bindings/kotlin/lib
          echo "Creating platform directories and copying libraries..."
          mkdir -p linux-x86-64 linux-aarch64 darwin-x86-64 darwin-aarch64 win32-x86-64
          cp ../../../libs/native-lib-ubuntu-latest-x86_64-unknown-linux-gnu/linux-x86-64/libiota_sdk_ffi.so linux-x86-64/
          cp ../../../libs/native-lib-ubuntu-latest-aarch64-unknown-linux-gnu/linux-aarch64/libiota_sdk_ffi.so linux-aarch64/
          cp ../../../libs/native-lib-macos-latest-x86_64-apple-darwin/darwin-x86-64/libiota_sdk_ffi.dylib darwin-x86-64/
          cp ../../../libs/native-lib-macos-latest-aarch64-apple-darwin/darwin-aarch64/libiota_sdk_ffi.dylib darwin-aarch64/
          cp ../../../libs/native-lib-windows-latest-x86_64-pc-windows-msvc/win32-x86-64/iota_sdk_ffi.dll win32-x86-64/
          echo "Contents after copying:"
          ls -la linux-* darwin-* win32-*

      - name: Generate Kotlin bindings
        run: |
          cd bindings/kotlin
          # Generate bindings using the Linux x86_64 library (arbitrary choice)
          cargo run --bin iota_sdk_bindings -- generate --library "lib/linux-x86-64/libiota_sdk_ffi.so" --language kotlin --out-dir lib --no-format -c uniffi.toml

      - name: Set version for release
        if: github.event_name == 'release'
        run: |
          cd bindings/kotlin
          sed -i "s/version = .*/version = \"${{ github.event.release.tag_name }}\"/" build.gradle.kts

      - name: Set version for manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          cd bindings/kotlin
          sed -i "s/version = .*/version = \"${{ github.event.inputs.version }}\"/" build.gradle.kts

      - name: Publish to Maven Central
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == false)
        run: |
          cd bindings/kotlin
          ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-parallel --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_BASE64_ENCODED_ASCII_ARMORED_SIGNING_KEY }}

      - name: Dry run - Local publish only
        if: github.event_name != 'release' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == true)
        run: |
          cd bindings/kotlin
          echo "Dry run: Publishing to local Maven repository only"
          ./gradlew publishToMavenLocal --no-daemon --no-parallel --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_BASE64_ENCODED_ASCII_ARMORED_SIGNING_KEY }}
