name: Semver Checks

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: semver-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  semver-checks:
    if: (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[run-ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: rust version
        run: |
          rustc --version
          cargo --version

      # Pinned: cargo-semver-checks has to understand the rustdoc JSON format
      # the runner's stable toolchain emits, so it needs bumping whenever that
      # format moves ahead of what the pinned version supports.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Check for breaking API changes
        run: make semver-checks
