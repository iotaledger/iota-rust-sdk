name: Publish Kotlin to Maven Central

on:
  # TODO: remove after testing
  push:
    branches: [ci/kotlin-release]
  release:
    types: [published]

jobs:
  build:
    # if: contains(github.event.release.tag_name, 'kotlin')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            folder: linux-x86-64
            lib_name: libiota_sdk_ffi.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            folder: linux-aarch64
            lib_name: libiota_sdk_ffi.so
          - os: macos-latest
            target: x86_64-apple-darwin
            folder: darwin-x86-64
            lib_name: libiota_sdk_ffi.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            folder: darwin-aarch64
            lib_name: libiota_sdk_ffi.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            folder: windows-x86-64
            lib_name: iota_sdk_ffi.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            folder: win32-aarch64
            lib_name: iota_sdk_ffi.dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331 # v1.91.1
        with:
          targets: ${{ matrix.target }}
          toolchain: stable
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build the library
        shell: bash
        run: |
          cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p bindings/kotlin/lib/${{ matrix.folder }}
          cp "$TARGET_DIR/${{ matrix.lib_name }}" bindings/kotlin/lib/${{ matrix.folder }}/
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload native library
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: native-lib-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/kotlin/lib/${{ matrix.folder }}/

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download native libraries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: bindings/kotlin/lib
          pattern: native-lib-*
          merge-multiple: true

      - name: List downloaded libraries
        run: |
          echo "Contents of bindings/kotlin/lib:"
          ls -la bindings/kotlin/lib/

      # Uncomment for testing publishing without actually releasing
      - name: Dry run - Local publish only
        run: |
          cd bindings/kotlin
          echo "Dry run: Publishing to local Maven repository only"
          ./gradlew publishToMavenLocal --no-daemon --no-parallel --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_BASE64_ENCODED_ASCII_ARMORED_SIGNING_KEY }}

      # - name: Publish to Maven Central
      #   run: |
      #     cd bindings/kotlin
      #     ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-parallel --no-configuration-cache
      #   env:
      #     ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_USERNAME }}
      #     ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_PASSWORD }}
      #     ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PASSWORD }}
      #     ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_BASE64_ENCODED_ASCII_ARMORED_SIGNING_KEY }}
