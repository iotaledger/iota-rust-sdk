name: Publish Kotlin SDK to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_publish:
        description: "Publish to Maven Local"
        required: false
        default: true
        type: boolean

jobs:
  build:
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'iota-kotlin-sdk')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            folder: linux-x86-64
            lib_name: libiota_sdk_ffi.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            folder: linux-aarch64
            lib_name: libiota_sdk_ffi.so
          - os: macos-latest
            target: x86_64-apple-darwin
            folder: darwin-x86-64
            lib_name: libiota_sdk_ffi.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            folder: darwin-aarch64
            lib_name: libiota_sdk_ffi.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            folder: windows-x86-64
            lib_name: iota_sdk_ffi.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            folder: win32-aarch64
            lib_name: iota_sdk_ffi.dll
          - os: ubuntu-latest
            target: aarch64-linux-android
            folder: android-aarch64
            lib_name: libiota_sdk_ffi.so
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            folder: android-arm
            lib_name: libiota_sdk_ffi.so
          - os: ubuntu-latest
            target: x86_64-linux-android
            folder: android-x86-64
            lib_name: libiota_sdk_ffi.so
          - os: ubuntu-latest
            target: i686-linux-android
            folder: android-x86
            lib_name: libiota_sdk_ffi.so
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@0f44b27771c32bda9f458f75a1e241b09791b331
        with:
          targets: ${{ matrix.target }}
          toolchain: stable

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: kotlin-${{ matrix.target }}

      - name: Setup Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - name: Build the library
        if: ${{ !contains(matrix.target, 'android') }}
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build -p iota-sdk-ffi --lib --release --target ${{ matrix.target }}
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p temp/${{ matrix.folder }}
          cp "$TARGET_DIR/${{ matrix.lib_name }}" temp/${{ matrix.folder }}/

      - name: Build the library (Android)
        if: contains(matrix.target, 'android')
        shell: bash
        run: |
          cargo ndk -t ${{ matrix.target }} -P 21 build -p iota-sdk-ffi --lib --release
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p temp/${{ matrix.folder }}
          cp "$TARGET_DIR/${{ matrix.lib_name }}" temp/${{ matrix.folder }}/

      - name: Upload native library
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: native-lib-${{ matrix.target }}
          path: temp/

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: kotlin-publish

      - name: Generate Kotlin bindings
        run: make kotlin

      - name: Download native libraries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: bindings/kotlin/lib
          pattern: native-lib-*
          merge-multiple: true

      - name: Test publish - local only
        if: github.event_name == 'workflow_dispatch' && inputs.test_publish == true
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_BASE64_ENCODED_ASCII_ARMORED_SIGNING_KEY }}
        run: |
          cd bindings/kotlin || exit 1
          echo "Dry run: Publishing to local Maven repository only"
          ./gradlew publishToMavenLocal --no-daemon --no-parallel --no-configuration-cache

      - name: Publish to Maven Central
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_publish == false)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_BASE64_ENCODED_ASCII_ARMORED_SIGNING_KEY }}
        run: |
          cd bindings/kotlin || exit 1
          ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-parallel --no-configuration-cache
