[package]
name = "async-compat"
version = "0.2.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Compatibility adapter between tokio and futures (patched for wasm32)"
publish = false

[dependencies]
pin-project-lite = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
once_cell = "1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# no extra deps needed – just pin-project-lite above
