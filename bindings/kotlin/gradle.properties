# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
# The dokka reference build GC-thrashes at Gradle's default 512 MiB heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

# Dokka's K2 analysis finds nothing to document in the uniffi-generated
# lib/iota_sdk.kt and silently produces an empty publication, so the
# reference docs are generated with the K1 analysis.
org.jetbrains.dokka.experimental.tryK2=false
org.jetbrains.dokka.experimental.tryK2.noWarn=true
