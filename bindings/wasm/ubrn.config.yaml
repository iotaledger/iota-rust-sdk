rust:
  directory: ../../crates/iota-sdk-ffi
  manifestPath: ../../crates/iota-sdk-ffi/Cargo.toml

web:
  # Use our existing wasm crate (already a Cargo workspace member).
  workspace: true
  manifestPath: iota-sdk-wasm/Cargo.toml
  # ubrn defaults the generated crate name to the package.json name, which is the
  # scoped npm name "@iota/sdk-wasm" — not a valid Rust crate name. Pin it.
  wasmCrateName: iota-sdk-wasm
  ts: ./src/ts
  entrypoint: ./src/ts/index.web.ts
  target: bundler

  # The FFI crate's `grpc` default feature pulls in tonic, which does not build
  # for wasm32-unknown-unknown, so opt out of the defaults and name what the
  # WASM bindings need.
  defaultFeatures: false
  features:
    - crypto
    - bls12381

  # RUSTFLAGS for the wasm32 compilation.
  rustflags:
    - "-C"
    - "link-arg=--export-table"
    - "-C"
    - "link-arg=--growable-table"
    - "--cfg"
    - 'getrandom_backend="wasm_js"'

  # TOML patch merged into the generated wasm crate Cargo.toml.
  manifestPatchFile: ./wasm-cargo-patch.toml

# Protect our custom entrypoint from being overwritten.
noOverwrite:
  - "**/index.web.ts"
