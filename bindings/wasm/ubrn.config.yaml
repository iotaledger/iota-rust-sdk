rust:
  directory: ../../crates/iota-sdk-ffi
  manifestPath: ../../crates/iota-sdk-ffi/Cargo.toml

web:
  # Use our existing wasm crate (already a Cargo workspace member).
  workspace: true
  manifestPath: ../../crates/iota-sdk-wasm/Cargo.toml
  ts: ./src/ts
  entrypoint: ./src/ts/index.web.ts
  target: bundler

  # RUSTFLAGS for the wasm32 compilation.
  rustflags:
    - "-C"
    - "link-arg=--export-table"
    - "-C"
    - "link-arg=--growable-table"
    - "--cfg"
    - 'getrandom_backend="wasm_js"'

  # Extra flags forwarded to wasm-bindgen when processing the wrapper WASM.
  # --keep-lld-exports preserves LLD-synthesised exports (e.g.
  # __indirect_function_table) that wasm-bindgen would otherwise strip.
  # We need __indirect_function_table exported from index_bg.wasm so that the
  # JS initialisation code can grow and share it with iota_sdk_ffi_bg.wasm.
  wasmBindgenExtras:
    - "--keep-lld-exports"

  # TOML patch merged into the generated wasm crate Cargo.toml.
  manifestPatchFile: ./wasm-cargo-patch.toml

# Protect our custom entrypoint and crate files from being overwritten.
noOverwrite:
  - "**/index.web.ts"
  - ../../crates/iota-sdk-wasm/src/lib.rs
  - ../../crates/iota-sdk-wasm/Cargo.toml
