[workspace]
resolver = "2"
members = [
  "bindings/wasm/iota-sdk-wasm",
  "crates/integration-tests",
  "crates/iota-sdk",
  "crates/iota-sdk-bcs-schema",
  "crates/iota-sdk-crypto",
  "crates/iota-sdk-ffi",
  "crates/iota-sdk-graphql-client",
  "crates/iota-sdk-graphql-client-build",
  "crates/iota-sdk-grpc-client",
  "crates/iota-sdk-grpc-proto-build",
  "crates/iota-sdk-grpc-types",
  "crates/iota-sdk-move-types",
  "crates/iota-sdk-move-types/examples/capture_move_type_fixtures",
  "crates/iota-sdk-transaction-builder",
  "crates/iota-sdk-types",
  "crates/iota-sdk/examples/polling-indexer",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_cfg)'] }

[workspace.lints.clippy]
redundant_clone = "warn"
uninlined_format_args = "warn"
unused_async = "warn"

[workspace.dependencies]
# external dependencies
async-stream = "0.3"
base64ct = "1.6.0"
bcs = "0.1.6"
cynic = "3.7.3"
derive_more = "2.1.1"
eyre = "0.6"
futures = "0.3.29"
getrandom_2 = { version = "0.2", package = "getrandom", features = ["js"] }
getrandom_3 = { version = "0.3", package = "getrandom", features = ["wasm_js"] }
graphql-ws-client = { version = "0.13", default-features = false, features = ["client-cynic", "tungstenite-0.28"] }
hex = "0.4.3"
js-sys = "0.3"
paste = "1.0.15"
primitive-types = { version = "0.14", features = ["impl-serde"] }
proc-macro2 = "1"
proptest = { version = "1.6.0", default-features = false }
prost = "0.14"
prost-types = "0.14"
quote = "1"
rand = "0.8.5"
rand_core = "0.6.4"
reqwest = { version = "0.12", default-features = false }
roaring = { version = "0.11.2", default-features = false }
serde = "1.0.210"
serde_json = "1.0.128"
strum = "0.27.2"
syn = { version = "2", features = ["full"] }
test-strategy = "0.4.0"
thiserror = "2.0"
tokio = "1.52.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tonic = "0.14"
tracing = "0.1"
variadics_please = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

# internal dependencies
iota-bcs-schema = { version = "1.0.0-beta.1", package = "iota-sdk-bcs-schema", path = "crates/iota-sdk-bcs-schema" }
iota-crypto = { version = "0.0.1-alpha.1", package = "iota-sdk-crypto", path = "crates/iota-sdk-crypto", default-features = false }
iota-graphql-client = { version = "0.0.1-alpha.1", package = "iota-sdk-graphql-client", path = "crates/iota-sdk-graphql-client", default-features = false }
iota-graphql-client-build = { version = "0.0.1-alpha.1", package = "iota-sdk-graphql-client-build", path = "crates/iota-sdk-graphql-client-build", default-features = false }
iota-grpc-client = { version = "0.0.1-alpha.1", package = "iota-sdk-grpc-client", path = "crates/iota-sdk-grpc-client", default-features = false }
iota-grpc-proto-build = { version = "0.0.1-alpha.1", package = "iota-sdk-grpc-proto-build", path = "crates/iota-sdk-grpc-proto-build", default-features = false }
iota-grpc-types = { version = "0.0.1-alpha.1", package = "iota-sdk-grpc-types", path = "crates/iota-sdk-grpc-types", default-features = false }
iota-move-types = { version = "0.0.1-alpha.1", package = "iota-sdk-move-types", path = "crates/iota-sdk-move-types", default-features = false }
iota-sdk = { version = "3.0.0-alpha.1", package = "iota-sdk", path = "crates/iota-sdk", default-features = false }
iota-transaction-builder = { version = "0.0.1-alpha.1", package = "iota-sdk-transaction-builder", path = "crates/iota-sdk-transaction-builder", default-features = false }
iota-types = { version = "1.0.0-beta.1", package = "iota-sdk-types", path = "crates/iota-sdk-types", default-features = false }

# Custom profile for WASM builds — optimizes for binary size.
# Usage: cargo build -p iota-sdk-wasm --profile wasm-release --target wasm32-unknown-unknown
[profile.wasm-release]
codegen-units = 1
inherits = "release"
lto = true
opt-level = "z"
panic = "abort"
strip = true
