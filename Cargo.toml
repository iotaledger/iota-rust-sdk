[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
base64ct = "1.6.0"
bcs = "0.1.6"
bnum = "0.12.0"
cynic = "3.7.3"
derive_more = "2.0"
eyre = "0.6"
futures = "0.3.29"
hex = "0.4.3"
itertools = "0.13.0"
paste = "1.0.15"
primitive-types = { version = "0.14", features = ["impl-serde"] }
proptest = { version = "1.6.0", default-features = false }
rand = "0.8.5"
rand_core = "0.6.4"
reqwest = { version = "0.12", default-features = false }
roaring = { version = "0.11.2", default-features = false }
serde = "1.0.210"
serde_derive = "1.0.210"
serde_json = "1.0.128"
test-strategy = "0.4.0"
thiserror = "2.0"
tokio = "1.40.0"
