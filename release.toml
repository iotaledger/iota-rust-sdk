enable-all-features = true
pre-release-hook = [
  "sh",
  "-c",
  'cd "$WORKSPACE_ROOT" && ./.github/gen_changelog.sh "$CRATE_NAME" "${CRATE_ROOT#"$WORKSPACE_ROOT"/}" "$COMMIT_TO" "$NEW_VERSION" true',
]
owners = ["github:iotaledger:dev-tools"]
pre-release-commit-message = "release: version bump"
sign-commit = true
